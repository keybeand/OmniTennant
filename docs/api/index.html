 true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ChannelAllocationUpdateRequest"}}}}, "responses": {"200": {"description": "Allocations updated", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/ChannelAllocationDto"}}}}}, "422": {"description": "Sum of allocations exceeds physical stock", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/ProblemDetails"}}}}}}}, "/inventory/skus/{skuCode}/safety-stock": {"put": {"tags": ["Omnichannel Inventory"], "summary": "Set SKU Safety Stock Threshold Buffer (UC11)", "security": [{"BearerAuth": []}, {"TenantIdHeader": []}], "parameters": [{"name": "skuCode", "in": "path", "required": true, "schema": {"type": "string"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SafetyStockUpdateRequest"}}}}, "responses": {"200": {"description": "Safety stock updated"}}}}, "/inventory/conflicts": {"get": {"tags": ["Omnichannel Inventory"], "summary": "List Inventory Sync Conflicts Queue (UC14)", "security": [{"BearerAuth": []}, {"TenantIdHeader": []}], "responses": {"200": {"description": "List of discrepancies", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/SyncConflictDto"}}}}}}}}, "/inventory/conflicts/{id}/resolve": {"post": {"tags": ["Omnichannel Inventory"], "summary": "Resolve Sync Conflict & Balance Ledger (UC14)", "security": [{"BearerAuth": []}, {"TenantIdHeader": []}], "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ResolveConflictRequest"}}}}, "responses": {"200": {"description": "Conflict resolved successfully"}}}}, "/webhooks/inventory": {"post": {"tags": ["Omnichannel Inventory"], "summary": "Ingest External WMS Inventory Webhook Delta (UC13)", "description": "Ingests real-time physical inventory delta. Secured by HMAC SHA-256 and Idempotency-Key.", "security": [{"WebhookSignature": []}], "parameters": [{"name": "X-OmniTenant-Timestamp", "in": "header", "required": true, "schema": {"type": "integer"}}, {"name": "Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string", "format": "uuid"}}, {"name": "X-Tenant-ID", "in": "header", "required": true, "schema": {"type": "string", "format": "uuid"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/InventoryWebhookPayload"}}}}, "responses": {"200": {"description": "Inventory delta ingested and channels rebalanced"}, "401": {"description": "Invalid HMAC signature", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/ProblemDetails"}}}}}}}, "/checkout/reserve": {"post": {"tags": ["Checkout & Orders"], "summary": "Phase 1: High-Concurrency Stock Reservation Hold (UC16)", "description": "Acquires Redis Redlock and decrements available channel stock. Creates temporary hold with 15-minute TTL.", "security": [], "parameters": [{"name": "X-Tenant-ID", "in": "header", "required": true, "schema": {"type": "string", "format": "uuid"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StockReservationRequest"}}}}, "responses": {"200": {"description": "Stock reserved successfully. 15-minute TTL hold active.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StockReservationResponse"}}}}, "409": {"description": "Insufficient stock. Zero overselling guarantee.", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/ProblemDetails"}}}}}}}, "/checkout/confirm": {"post": {"tags": ["Checkout & Orders"], "summary": "Phase 2: Idempotent Order Confirmation & Payment (UC16)", "description": "Commits the 15-minute hold into a final confirmed order.  {"$ref": "#/components/schemas/InviteUserRequest"}}}}, "responses": {"201": {"description": "Staff invitation dispatched"}}}}, "/analytics/dashboard-kpis": {"get": {"tags": ["Analytics & Audit"], "summary": "Get Backoffice Real-Time KPIs (UC08)", "security": [{"BearerAuth": []}, {"TenantIdHeader": []}], "parameters": [{"name": "dateFrom", "in": "query", "schema": {"type": "string", "format": "date"}}, {"name": "dateTo", "in": "query", "schema": {"type": "string", "format": "date"}}], "responses": {"200": {"description": "KPI metrics", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DashboardKpiDto"}}}}}}}, "/audit-logs": {"get": {"tags": ["Analytics & Audit"], "summary": "Filter Immutable Audit Trail (UC04)", "security": [{"BearerAuth": []}, {"TenantIdHeader": []}], "parameters": [{"name": "entityType", "in": "query", "schema": {"type": "string"}}, {"name": "page", "in": "query", "schema": {"type": "integer", "default": 1}}, {"name": "pageSize", "in": "query", "schema": {"type": "integer", "default": 20}}], "responses": {"200": {"description": "Audit logs list", "content": {"application/json": {"schema": {"type": "object", "properties": {"items": {"type": "array", "items": {"$ref": "#/components/schemas/AuditLogDto"}}, "meta": {"$ref": "#/components/schemas/PaginationMetaDto"}}}}}}}}}}, "components": {"securitySchemes": {"BearerAuth": {"type": "http", "scheme": "bearer", "bearerFormat": "JWT", "description": "15-minute stateless JWT containing user_id, tenant_id, and role claims."}, "TenantIdHeader": {"type": "apiKey", "in": "header", "name": "X-Tenant-ID", "description": "Target organization Tenant UUID."}, "WebhookSignature": {"type": "apiKey", "in": "header", "name": "X-OmniTenant-Signature", "description": "HMAC SHA-256 signature calculated over the request body."}}, "responses": {"ProblemUnauthorized": {"description": "Authentication failed or token expired", "content": {"application/problem+json": {"schema": {"$ref": "#/components/sc
